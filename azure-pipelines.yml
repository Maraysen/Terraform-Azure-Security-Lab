trigger:
- main

variables:
- group: terraform-secrets
- name: serviceConnection
  value: 'sc-azure-security-lab'

stages:
- stage: Plan
  displayName: 'Terraform Plan'

  jobs:
  - job: Plan
    displayName: 'Plan'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.15.8'

    - script: terraform version
      displayName: 'Check Terraform version'

    - script: terraform fmt -check -recursive
      displayName: 'Check Terraform formatting'

    - task: AzureCLI@2
      displayName: 'Terraform Init With Azure Authentication'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_USE_OIDC=true
          export ARM_USE_AZUREAD=true

          terraform init -reconfigure

    - script: terraform validate
      displayName: 'Terraform Validate'

    - script: |
        python -m pip install --upgrade pip
        pip install checkov

        # Lab exception: customer-managed keys are outside this lab's scope.
        checkov -d . --framework terraform --skip-check CKV2_AZURE_1
      displayName: 'Checkov IaC Security Scan'

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_USE_OIDC=true
          export ARM_USE_AZUREAD=true

          terraform plan -input=false -out=tfplan
      env:
        TF_VAR_lab_secret: '$(lab_secret)'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: Apply
    displayName: 'Apply Saved Terraform Plan'
    environment: 'terraform-production'

    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: 'Checkout Terraform configuration'

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '1.15.8'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)/terraform-plan'

          - task: AzureCLI@2
            displayName: 'Terraform Init and Apply'
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true

                terraform init -reconfigure
                terraform apply -input=false "$(Pipeline.Workspace)/terraform-plan/tfplan"
            env:
              TF_VAR_lab_secret: '$(lab_secret)'